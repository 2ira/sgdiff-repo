# RQ2: only 1% of the training sub-graphs are used. The remaining training
# edges stay in the graph (the paper does not mask them), so only the number of
# sampled sub-graphs shrinks -- exactly what `data.train_ratio` does.
data:
  name: cora
  train_ratio: 0.01
  max_eval_pairs: null
subgraph:
  hops: 1
  max_nodes_per_hop: null
structure:
  num_steps: 20
feature:
  enabled: true
  hidden_dim: 256
  num_steps: 100
train:
  epochs: 50
  pretrain_epochs: 10
