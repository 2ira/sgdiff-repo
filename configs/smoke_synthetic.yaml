# Fast end-to-end smoke test (used by `make smoke` and the unit tests).
# The light edge-GNN denoiser keeps it runnable on a laptop CPU.
data:
  name: synthetic
  max_train_pairs: 256
  max_eval_pairs: 80
subgraph:
  hops: 1
  max_nodes_per_hop: 10
structure:
  arch: edge_gnn
  hidden_dim: 32
  num_layers: 2
  num_steps: 6
  num_mc_samples: 3
feature:
  hidden_dim: 32
  num_layers: 2
  num_steps: 6
  num_mc_samples: 3
train:
  epochs: 3
  pretrain_epochs: 1
  finetune_epochs: 2
  finetune_mc_samples: 3
  batch_size: 16
  eval_batch_size: 16
