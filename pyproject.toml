[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sgdiff"
version = "0.1.0"
description = "Reproduction of 'Sub-graph Based Diffusion Model for Link Prediction' (LoG 2024)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SGDiff reproduction contributors" }]
keywords = ["link-prediction", "diffusion-model", "graph-neural-network", "reproduction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "torch>=2.0",
    "PyYAML>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sgdiff = "sgdiff.cli.main:main"

[tool.setuptools.packages.find]
include = ["sgdiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
